<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2126"/>
      <stop offset="1" stop-color="#0A0B0D"/>
    </linearGradient>

    <!-- Экран 1 (teal) -->
    <linearGradient id="s1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FF2D8"/>
      <stop offset="1" stop-color="#19E0C0"/>
    </linearGradient>

    <!-- Экран 2 (violet) -->
    <linearGradient id="s2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9A7CFF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#19E0C0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#19E0C0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="shadow" x="-40%" y="-20%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="playGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Корпус -->
  <g filter="url(#shadow)">
    <rect x="48" y="48" width="928" height="928" rx="232" fill="url(#body)"/>
    <rect x="48" y="48" width="928" height="928" rx="232" fill="url(#glow)"/>
    <rect x="48" y="48" width="928" height="928" rx="232" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  </g>

  <!--
    КОНЦЕПТ B · «ДВА ЭКРАНА»
    Мотив «overlapping frames» из референсов Dribbble/Behance:
    два кадра-экрана наезжают друг на друга (два зрителя, два девайса),
    а в общей зоне пересечения — один общий play. Together + sync.
    Читается в 60px как два слоя с общим пульсом.
  -->

  <!-- Экран 1 (violet, сзади, смещён влево-вверх) -->
  <g transform="rotate(-8 512 512)">
    <rect x="196" y="196" width="396" height="396" rx="88" fill="url(#s2)" opacity="0.92"/>
    <!-- Световой блик на стекле -->
    <path d="M236 236 L460 236 L340 420 Z" fill="#FFFFFF" opacity="0.18"/>
  </g>

  <!-- Экран 2 (teal, спереди, смещён вправо-вниз) -->
  <g transform="rotate(8 512 512)">
    <rect x="432" y="432" width="396" height="396" rx="88" fill="url(#s1)"/>
    <path d="M472 472 L696 472 L576 656 Z" fill="#FFFFFF" opacity="0.22"/>
  </g>

  <!-- Общий play в зоне пересечения -->
  <g filter="url(#playGlow)">
    <path d="M470 486 L470 590 L566 538 Z" fill="#0A0B0D"/>
  </g>
</svg>
