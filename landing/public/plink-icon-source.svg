<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="85%">
      <stop offset="0" stop-color="#171b1c"/>
      <stop offset="0.52" stop-color="#0d1011"/>
      <stop offset="1" stop-color="#05070707"/>
    </radialGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f3ecda"/>
      <stop offset="1" stop-color="#D4A853"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f2f4f3" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#f2f4f3" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#f2f4f3" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/></filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="524" cy="516" r="430" fill="url(#halo)"/>

  <!-- эхо-кадры: смотрим синхронно, кадр в кадр -->
  <path d="M400 330 L400 694 L716 512 Z"
        transform="translate(-92,-92)"
        fill="none" stroke="#D4A853" stroke-opacity="0.14"
        stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M400 330 L400 694 L716 512 Z"
        transform="translate(-50,-50)"
        fill="none" stroke="#D4A853" stroke-opacity="0.32"
        stroke-width="38" stroke-linejoin="round" stroke-linecap="round"/>

  <path d="M400 330 L400 694 L716 512 Z"
        fill="#D4A853" opacity="0.4" filter="url(#glow)"/>
  <path d="M400 330 L400 694 L716 512 Z"
        fill="url(#tri)" stroke="url(#tri)"
        stroke-width="72" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- виньетка и зерно -->
  <radialGradient id="vig" cx="50%" cy="46%" r="75%">
    <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
  </radialGradient>
  <rect width="1024" height="1024" fill="url(#vig)"/>
  <rect width="1024" height="1024" filter="url(#noise)" opacity="0.035"/>
</svg>
