# CI for the Plink monorepo: backend, landing, Android client, and the
# cross-cutting security gates. See docs/qa/testing-strategy.md for what each
# job is responsible for and what it deliberately does not cover.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Redis is a service, not an optional extra. The integration suite skips
    # itself when REDIS_URL is absent, so without this block the run still goes
    # green while silently testing less than it reports.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Prisma Client is generated code. tsc cannot resolve the model types
      # until it exists, so this runs before the typecheck, not with the build.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # ESLint carries two invariants that documentation cannot: configuration is
      # read only in src/config/, and output goes through the Fastify logger
      # rather than console.*. Files that predate both are listed explicitly in
      # eslint.config.js as a baseline that may shrink and must never grow, so a
      # new violation in any other file fails here.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npx vitest run

      # The gate is `high` because the count is currently zero, and a zero is
      # only worth having if something keeps it there. The remaining moderate
      # advisories share one root (@opentelemetry/core via @sentry/node 8) and
      # clear only on a major upgrade — a deliberate decision, not a silent
      # exception, so the gate stays above them.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  landing:
    name: landing (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # This package is fully formatted, so the check is absolute here rather
      # than limited to changed files the way the `format` job below is.
      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical

  # Formatting is enforced on what a change touches, not on the whole tree.
  # backend/src predates the Prettier config by about 13,000 lines of pure
  # whitespace; reformatting it in one commit would bury every real change under
  # it and break `git blame` for the entire route layer. So the formatted share
  # of the repository grows monotonically instead: a file you edit has to come
  # out formatted. See CONTRIBUTING.md for how to clear a directory deliberately.
  #
  # Runs on push as well as on pull_request. A push has no base branch, which is
  # why this job used to skip one — and skipping it there meant a direct push to
  # main was the one way into the tree that nothing formatted. On push the range
  # comes from the event's `before` SHA instead.
  format:
    name: format (files changed by this change)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff needs the base branch, which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Prettier lives in backend; the root has no package.json. Only Prettier
      # itself is needed, so this skips the rest of the backend's dependencies.
      - name: Install Prettier
        run: npm ci --ignore-scripts
        working-directory: backend

      # One place decides what "changed" means, for both this job and the reader.
      # Three dots for a pull request: the comparison is against the merge base,
      # so commits that landed on the base branch after the fork are not blamed on
      # this change. Two dots for a push: `before..HEAD` is exactly what the push
      # added, and there is no merge base to look for.
      #
      # `before` is unusable in two cases, and both mean "no useful range" rather
      # than "check nothing": a brand-new branch (all-zero SHA) and a force-push
      # (the old SHA is gone from the remote). HEAD~1 covers the first, and the
      # second falls through to it too — the last commit is still worth checking.
      - name: Resolve the range this change covers
        id: range
        env:
          # Via env rather than inlined into the script: the base branch is
          # attacker-controlled text on a fork PR, and `${{ }}` interpolation
          # pastes it into the shell before bash sees it.
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            echo "range=origin/$BASE_REF...HEAD" >> "$GITHUB_OUTPUT"
            echo "✓ Comparing against the merge base with origin/$BASE_REF"
          elif [ -n "$BEFORE" ] \
            && [ "$BEFORE" != '0000000000000000000000000000000000000000' ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "range=$BEFORE..HEAD" >> "$GITHUB_OUTPUT"
            echo "✓ Comparing against the pushed-over commit $BEFORE"
          elif git rev-parse --verify -q HEAD~1 >/dev/null; then
            echo 'range=HEAD~1..HEAD' >> "$GITHUB_OUTPUT"
            echo '✓ No usable base — comparing against HEAD~1'
          else
            echo 'range=' >> "$GITHUB_OUTPUT"
            echo '✓ Root commit — nothing to compare against'
          fi

      - name: Check formatting of changed files
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          if [ -z "$RANGE" ]; then
            echo '✓ No range to check'
            exit 0
          fi

          list="${RUNNER_TEMP:-/tmp}/changed-files.txt"

          # ACMR: added, copied, modified, renamed. Deleted files have nothing to
          # check. landing/ is excluded because its own job checks it in full, and
          # because its Prettier config resolves a plugin out of landing/
          # node_modules, which this job does not install.
          #
          # Written to a file rather than read into an array: `mapfile` needs bash
          # 4, and the bash on a macOS developer machine is 3.2, so the array form
          # runs here and fails for anyone reproducing it locally.
          git diff --name-only --diff-filter=ACMR "$RANGE" \
            | grep -v '^landing/' > "$list" || true

          if [ ! -s "$list" ]; then
            echo '✓ No files to check'
            exit 0
          fi

          cat "$list"

          # NUL-delimited so a path containing a space is one argument, and
          # --ignore-unknown skips Swift, Kotlin, shell, and everything else
          # Prettier has no parser for instead of failing on the first one.
          tr '\n' '\0' < "$list" \
            | xargs -0 ./backend/node_modules/.bin/prettier --check --ignore-unknown

  # Three invariants that are cheap to check here and expensive to notice in
  # production. Each one guards a property the code depends on but cannot
  # express in its own types.
  security:
    name: security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The pages served from web.ts run under a strict CSP: default-src 'none',
      # scripts allowed only inline with a per-response nonce. An external
      # <script src=…> therefore either does nothing or means the CSP was
      # loosened. Matching on `src=` rather than on `<script` keeps legitimate
      # nonced inline scripts passing.
      - name: No external scripts in server-rendered pages
        run: |
          if grep -nE '<script[^>]+src=' backend/src/routes/web.ts; then
            echo '✗ External script in web.ts.'
            echo '  CSP default-src none blocks it; if it loads, the CSP was weakened.'
            echo '  Use an inline script with the response nonce.'
            exit 1
          fi
          echo '✓ No external scripts'

      # Substring host matching is an open redirect into the room WebView:
      # evil-vk.com.ru contains "vk.com", so a substring check accepts it and
      # every participant loads the attacker's page. All host comparison goes
      # through PlinkHost.matches, which compares registrable domains.
      - name: Host matching goes through PlinkHost
        run: |
          # Comments that describe the hazard are not violations of it, so lines
          # that are themselves comments are excluded from the match.
          hits=$(grep -rn --include='*.swift' \
                   -E 'host\??\.(lowercased\(\)\.)?contains\("' ios/Plink \
                 | grep -vE ':[[:space:]]*(//|\*|/\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo '✗ Substring host match. Use PlinkHost.matches instead.'
            exit 1
          fi
          if [ ! -f ios/Plink/Utilities/PlinkHost.swift ]; then
            echo '✗ Utilities/PlinkHost.swift is gone — strict host matching lost.'
            exit 1
          fi
          echo '✓ Strict host matching in place'

      - name: No committed private keys
        run: |
          if grep -rnE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
               --include='*.ts' --include='*.swift' --include='*.kt' \
               --include='*.json' --include='*.xcconfig' \
               --exclude-dir=node_modules --exclude-dir=.git .; then
            echo '✗ Private key committed to the repository'
            exit 1
          fi
          echo '✓ No private keys in tracked sources'

  android:
    name: android-client (assembleDebug)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ios/android-client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('ios/android-client/**/*.gradle*') }}

      - name: Build debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

  # The iOS build and unit tests live in .github/workflows/ios.yml, not here.
  #
  # This repository is private, so macOS runner minutes bill at 10× the Linux rate. Every
  # job in this file is cheap enough to run on every push; the Xcode build is not, so it
  # is path-filtered to changes under ios/ and kept in its own workflow where that
  # filter cannot accidentally skip the backend checks too.
