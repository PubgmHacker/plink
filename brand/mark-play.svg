<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент корпуса -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15181A"/>
      <stop offset="100%" stop-color="#0A0C0D"/>
    </linearGradient>
    
    <!-- Блик обводки -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════════
       УПРОЩЁННАЯ ИКОНКА: play-треугольник + вертикальные полосы
       Используется на лендинге (web.ts) — компактная и читаемая
       ═══════════════════════════════════════════════════════════════════ -->
  
  <!-- Корпус -->
  <rect width="120" height="120" rx="27" fill="url(#body)"/>
  
  <!-- Обводка -->
  <rect width="120" height="120" rx="27" fill="none" stroke="url(#rim)" stroke-width="1"/>
  
  <!-- Вертикальная полоса слева -->
  <path d="M30 38 V82" 
        stroke="#F2F4F3" 
        stroke-width="7" 
        stroke-linecap="round" 
        opacity="0.9"/>
  
  <!-- Play-треугольник -->
  <polygon points="50 34 88 60 50 86" 
           fill="#F2F4F3"/>
</svg>
