<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262B"/>
      <stop offset="1" stop-color="#0C0E10"/>
    </linearGradient>

    <!-- Тёплый свет экрана — постоянный цвет бренда -->
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF0D6"/>
      <stop offset="1" stop-color="#FFB86C"/>
    </linearGradient>

    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DF0D4"/>
      <stop offset="1" stop-color="#19E0C0"/>
    </linearGradient>

    <radialGradient id="coreglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD694" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#19E0C0" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#19E0C0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="shadow" x="-40%" y="-20%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="triGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Корпус -->
  <g filter="url(#shadow)">
    <rect x="48" y="48" width="928" height="928" rx="232" fill="url(#body)"/>
    <rect x="48" y="48" width="928" height="928" rx="232" fill="url(#coreglow)"/>
    <rect x="48" y="48" width="928" height="928" rx="232" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  </g>

  <!--
    ГЛАВНАЯ ИДЕЯ «ФИЛЬМ-ПЛЕЙ»:
    Play-треугольник, собранный из кадров киноплёнки.
    Левая грань — плёнка с перфорацией (кадры), тёплый свет экрана.
    Тело — teal-градиент. Кино + play + тепло = Plink.
    У конкурентов плей безликий белый; здесь play рассказывает
    историю кинотеатра.
  -->

  <!-- Эхо-контур -->
  <path d="M392 368 L392 656 L660 512 Z"
        fill="none" stroke="#F5F7F6" stroke-opacity="0.10" stroke-width="20"
        stroke-linejoin="round" stroke-linecap="round"
        transform="translate(36,36)" filter="url(#triGlow)"/>

  <!-- ТЕЛО плей-треугольника (teal) -->
  <g filter="url(#triGlow)">
    <path d="M400 370 L400 654 L662 512 Z" fill="url(#teal)"/>
  </g>

  <!-- КИНОПЛЁНКА вдоль левой грани: лента с перфорацией -->
  <!-- Лента -->
  <rect x="352" y="352" width="118" height="320" rx="30" fill="url(#warm)"/>
  <!-- Перфорация: квадратные кадры -->
  <g fill="#0C0E10">
    <rect x="378" y="386" width="66" height="46" rx="10"/>
    <rect x="378" y="452" width="66" height="46" rx="10"/>
    <rect x="378" y="518" width="66" height="46" rx="10"/>
    <rect x="378" y="584" width="66" height="46" rx="10"/>
  </g>
  <!-- Отверстия перфорации сверху/снизу -->
  <g fill="#FFD694">
    <circle cx="411" cy="368" r="11"/>
    <circle cx="411" cy="656" r="11"/>
  </g>

  <!-- Точка-указатель: тёплый кадр на вершине плей -->
  <circle cx="648" cy="512" r="20" fill="#F5F7F6" opacity="0.9"/>

  <!-- Блик на верхней кромке -->
  <path d="M404 374 L588 506"
        stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="10" stroke-linecap="round"/>

  <!-- Виньетка -->
  <radialGradient id="vig" cx="50%" cy="46%" r="78%">
    <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.42"/>
  </radialGradient>
  <rect width="1024" height="1024" fill="url(#vig)"/>
</svg>
