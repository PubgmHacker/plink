<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2126"/>
      <stop offset="1" stop-color="#0A0B0D"/>
    </linearGradient>

    <!-- Монограмма: teal → violet (аналогичный градиент) -->
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FF2D8"/>
      <stop offset="0.5" stop-color="#19E0C0"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#19E0C0" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#19E0C0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="shadow" x="-40%" y="-20%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="monoGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Корпус -->
  <g filter="url(#shadow)">
    <rect x="48" y="48" width="928" height="928" rx="232" fill="url(#body)"/>
    <rect x="48" y="48" width="928" height="928" rx="232" fill="url(#glow)"/>
    <rect x="48" y="48" width="928" height="928" rx="232" fill="none" stroke="url(#rim)" stroke-width="2.5"/>
  </g>

  <!--
    КОНЦЕПТ C · «П-МОНОГРАММА»
    Принцип Plex/Notion: буква как знак. Геометрическая P,
    собранная из кинокадров: вертикальная лента = плёнка с перфорацией,
    «голова» P = плей. P = Plink + Play. Монограмма переживает
    маленькие размеры лучше любых силуэтов.
  -->

  <!-- Вертикальная лента-плёнка (стебель P) -->
  <g filter="url(#monoGlow)">
    <rect x="330" y="180" width="180" height="664" rx="90" fill="url(#mono)"/>
  </g>

  <!-- Голова P: дуга-плей -->
  <g filter="url(#monoGlow)">
    <path d="M510 200 
             A 240 240 0 0 1 510 680
             L 360 680 L 360 200 Z"
          fill="url(#mono)"/>
  </g>

  <!-- Перфорация в стебле (кадры) -->
  <g fill="#0A0B0D">
    <rect x="392" y="252" width="56" height="56" rx="16"/>
    <rect x="392" y="364" width="56" height="56" rx="16"/>
    <rect x="392" y="476" width="56" height="56" rx="16"/>
    <rect x="392" y="588" width="56" height="56" rx="16"/>
  </g>

  <!-- Световой блик -->
  <path d="M360 210 L440 180" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="14" stroke-linecap="round"/>
</svg>
