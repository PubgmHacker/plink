<svg width="300" height="360" viewBox="0 0 300 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3C42"/>
      <stop offset="100%" stop-color="#16171B"/>
    </linearGradient>
    
    <radialGradient id="screen-heat" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#FFF0D6"/>
      <stop offset="40%" stop-color="#FFD694"/>
      <stop offset="100%" stop-color="#FFB86C"/>
    </radialGradient>
    
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFD694" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#FFD694" stop-opacity="0"/>
    </radialGradient>
    
    <radialGradient id="outer-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD694" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFD694" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="text-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F7F6"/>
      <stop offset="100%" stop-color="#E8DFD2"/>
    </linearGradient>
  </defs>

  <!-- Внешнее гало -->
  <circle cx="150" cy="120" r="115" fill="url(#outer-halo)" opacity="0.6"/>

  <!-- ═══════════════════════════════════════════════════
       ИКОНКА 180×180 (по центру)
       ═══════════════════════════════════════════════════ -->
  <g transform="translate(60, 30)">
    <!-- Корпус -->
    <rect width="180" height="180" rx="41" fill="url(#body)"/>
    <rect width="180" height="180" rx="41" fill="url(#halo)"/>
    
    <!-- Экран: 54% × 31% = 97.2 × 55.8 -->
    <rect x="41.4" y="27.9" width="97.2" height="55.8" rx="6.3" fill="url(#screen-heat)"/>
    
    <!-- Летербокс -->
    <rect x="41.4" y="27.9" width="97.2" height="7.3" rx="6.3" fill="#08090B"/>
    <rect x="41.4" y="76.4" width="97.2" height="7.3" rx="6.3" fill="#08090B"/>
    
    <!-- Силуэты -->
    <circle cx="87.3" cy="111.6" r="7.6" fill="#08090B"/>
    <rect x="79.6" y="118.6" width="15.4" height="12.0" rx="5.0" fill="#08090B"/>
    <circle cx="133.7" cy="111.6" r="7.6" fill="#08090B"/>
    <rect x="126.0" y="118.6" width="15.4" height="12.0" rx="5.0" fill="#08090B"/>
    
    <!-- Диван -->
    <rect x="21.6" y="138.0" width="136.8" height="10.8" rx="4.5" fill="#08090B"/>
  </g>

  <!-- ═══════════════════════════════════════════════════
       ВОРДМАРК: PLINK — по центру под иконкой
       ═══════════════════════════════════════════════════ -->
  <text x="150" y="270" 
        font-family="'Playfair Display', 'Didot', 'Bodoni 72', Georgia, serif" 
        font-style="italic" 
        font-weight="900" 
        font-size="56" 
        letter-spacing="0.08em"
        fill="url(#text-ink)" 
        text-anchor="middle">PLINK</text>

  <!-- Слоган -->
  <text x="150" y="300" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-weight="500" 
        font-size="13" 
        letter-spacing="0.2em"
        fill="#6F938C" 
        text-anchor="middle"
        text-transform="uppercase">WATCH TOGETHER</text>
</svg>
