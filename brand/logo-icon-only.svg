<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент корпуса: графитовый, верх светлее -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A3C42"/>
      <stop offset="100%" stop-color="#16171B"/>
    </linearGradient>
    
    <!-- Тёплый свет экрана -->
    <radialGradient id="screen-heat" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#FFF0D6"/>
      <stop offset="40%" stop-color="#FFD694"/>
      <stop offset="100%" stop-color="#FFB86C"/>
    </radialGradient>
    
    <!-- Гало экрана на корпусе -->
    <radialGradient id="halo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFD694" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#FFD694" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Верхний блик корпуса -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD694" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFD694" stop-opacity="0.05"/>
    </linearGradient>
    
    <!-- Тень (тёплая) -->
    <filter id="shadow" x="-30%" y="-10%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#FFD694" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    
    <!-- Внешнее гало (луч проектора) -->
    <radialGradient id="outer-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD694" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFD694" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════════
       ВНЕШНЕЕ ГАЛО: знак стоит в луче проектора
       ═══════════════════════════════════════════════════════════════════ -->
  <circle cx="256" cy="256" r="230" fill="url(#outer-halo)" opacity="0.6"/>

  <!-- ═══════════════════════════════════════════════════════════════════
       КОРПУС: 256×256, скругление 23% (superellipse iOS)
       ═══════════════════════════════════════════════════════════════════ -->
  <g filter="url(#shadow)">
    <!-- Основной корпус -->
    <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#body)"/>
    
    <!-- Свечение экрана на корпусе -->
    <rect x="48" y="48" width="416" height="416" rx="96" fill="url(#halo)"/>
    
    <!-- Верхний блик (тёплый, не равномерная обводка) -->
    <rect x="48" y="48" width="416" height="416" rx="96" 
          fill="none" stroke="url(#rim)" stroke-width="1.8"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════════════
       ЭКРАН: 54% ширины × 31% высоты = 224.6 × 129.0
       Пропорция 2.35:1 (синемаскоп) — летербокс делает «кино»
       ═══════════════════════════════════════════════════════════════════ -->
  
  <!-- Экран: тёплый свет кадра -->
  <rect x="143.7" y="94.5" width="224.6" height="129.0" rx="18.1" fill="url(#screen-heat)"/>
  
  <!-- Летербокс: чёрные полосы сверху и снизу -->
  <!-- Толщина выводится из пропорции: (129 - 224.6/2.35) / 2 = 16.8 -->
  <rect x="143.7" y="94.5" width="224.6" height="16.8" rx="18.1" fill="#08090B"/>
  <rect x="143.7" y="206.7" width="224.6" height="16.8" rx="18.1" fill="#08090B"/>

  <!-- ═══════════════════════════════════════════════════════════════════
       ДВА СИЛУЭТА: «смотрим вместе»
       Голова = круг, плечи = скруглённый прямоугольник
       Цвет «темноты зала» — фигуры вырезаны из света
       ═══════════════════════════════════════════════════════════════════ -->
  
  <!-- Силуэт 1 (левый) -->
  <circle cx="202.2" cy="263.6" r="17.4" fill="#08090B"/>
  <rect x="184.6" y="279.6" width="35.2" height="27.6" rx="11.4" fill="#08090B"/>
  
  <!-- Силуэт 2 (правый) -->
  <circle cx="309.8" cy="263.6" r="17.4" fill="#08090B"/>
  <rect x="292.2" y="279.6" width="35.2" height="27.6" rx="11.4" fill="#08090B"/>

  <!-- ═══════════════════════════════════════════════════════════════════
       ДИВАН: одна плотная полоса, не доходит до краёв
       ═══════════════════════════════════════════════════════════════════ -->
  <rect x="97.3" y="314.3" width="317.4" height="24.6" rx="10.2" fill="#08090B"/>

  <!-- ═══════════════════════════════════════════════════════════════════
       НАДПИСЬ PLINK (опционально — для крупных размеров)
       ═══════════════════════════════════════════════════════════════════ -->
  <text x="256" y="430" 
        font-family="'Playfair Display', 'Didot', 'Bodoni 72', Georgia, serif" 
        font-style="italic" 
        font-weight="900" 
        font-size="38" 
        letter-spacing="0.08em"
        fill="#F5F7F6" 
        text-anchor="middle"
        opacity="0.9">PLINK</text>
</svg>
