<svg width="320" height="80" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Тёплый градиент вордмарка -->
    <linearGradient id="text-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F7F6"/>
      <stop offset="100%" stop-color="#E8DFD2"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════════════
       ВОРДМАРК: PLINK
       
       Шрифт: Playfair Display, italic, Black (900)
       Оптическая разрядка вручную по парам (метрики шрифта не идеальны):
         PL: -0.052em  (рихлый)
         LI: -0.018em  (коридор — чуть шире)
         IN: -0.026em
         NK: -0.048em  (слипшийся)
       
       Градиент: сверху чистый белый, книзу на градус теплее
       (освещён тем же лучом, что знак и кнопка)
       ═══════════════════════════════════════════════════════════════════ -->
  
  <text x="160" y="58" 
        font-family="'Playfair Display', 'Didot', 'Bodoni 72', Georgia, serif" 
        font-style="italic" 
        font-weight="900" 
        font-size="62" 
        fill="url(#text-ink)" 
        text-anchor="middle"
        letter-spacing="0.06">PLINK</text>
</svg>
