name: Plink CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — типы, линт, тесты
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plink_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['6379:6379']

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plink_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Prisma generate + migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Проверка типов
        run: npx tsc --noEmit

      - name: Линт
        run: npm run lint --if-present

      - name: Тесты
        run: npm test --if-present

  # Отдельный шаг: в лендингах не должно быть ни одного <script>.
  # Это та самая XSS-дыра из аудита — пусть CI стережᄅт еᄅ навсегда.
  security:
    name: Security — без инлайн-скриптов в лендингах
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Запрет <script> в web.ts
        run: |
          if grep -q '<script' backend/src/routes/web.ts; then
            echo '✗ В web.ts снова появился инлайн-скрипт. Это XSS-риск.'
            exit 1
          fi
          echo '✓ Инлайн-скриптов нет'

      - name: Запрет небезопасного матча доменов
        run: |
          if grep -rn 'host.contains("' ios/Plink/Services/MediaSourceResolver.swift; then
            echo '✗ host.contains пропускает фишинговые домены вроде evil-vk.com.ru'
            exit 1
          fi
          echo '✓ Строгий матч доменов на месте'

      - name: Поиск случайно закоммиченных секретов
        run: |
          if grep -rnE 'BEGIN (RSA |EC )?PRIVATE KEY' --include='*.ts' --include='*.swift' .; then
            echo '✗ В репозитории приватный ключ'
            exit 1
          fi
          echo '✓ Ключей в коде нет'

  ios:
    name: iOS — сборка и тесты
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Выбрать Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Сборка и тесты
        run: |
          xcodebuild test \
            -project ios/Plink.xcodeproj \
            -scheme Plink \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
