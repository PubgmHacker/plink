name: Plink
options:
  bundleIdPrefix: com.syncwatch
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

# PATCH 07: LiveKit Swift SDK — official SFU client for voice/video chat.
# Per runbook §9: SFU required for rooms > 4 participants (mesh fallback
# only for <= 4). LiveKit SDK provides Room, Participant, Track, and
# DataChannel APIs that RoomRTCController wraps.
#
# PATCH 15 + P0 voice: LiveKit re-enabled.
# Note: On first enable, Xcode/SPM will download WebRTC (~large). Use stable
# connection or pre-cache. If network fails, fall back to Agora/Daily.co.
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: 2.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.0.0
  # M13: pixel-level UI snapshot tests (opt-in via SNAPSHOT_TESTS=1)
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "2QAMUC4Z4P"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    OTHER_LDFLAGS: ""

targets:
  Plink:
    type: application
    platform: iOS
    sources:
      - path: Plink
        excludes:
          - "**/.DS_Store"
      - path: Plink/Resources/Info.plist
        buildPhase: none
    resources:
      - path: Plink/Resources
        excludes:
          - "**/.DS_Store"
          # Localization/*.lproj/Localizable.strings is a stale duplicate of
          # the in-code L10n.table (see Localization/LocalizationManager.swift).
          # Keeping it as a build resource collides with the real .lproj at
          # Resources/{en,ru}.lproj and breaks the build ("Multiple commands
          # produce .../en.lproj/Localizable.strings"). Exclude it from the
          # copy-resources phase; the Swift table remains the single source.
          - "Localization/**"
      - path: Plink/Resources/Emojis
        type: folder
      - path: Plink/Resources/LiveThemes
        type: folder
      - path: Plink/Resources/Avatars
        type: folder
      - path: Plink/Resources/Banners
        type: folder
      - path: Plink/Resources/CinemaBubbles
        type: folder
    # PATCH 15: LiveKit dependency disabled — see comment at top of file.
    # dependencies:
    #   - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syncwatch.plink
        INFOPLIST_FILE: Plink/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Plink/Resources/Plink.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "2QAMUC4Z4P"
        CODE_SIGN_IDENTITY: "Apple Development"
        SUPPORTS_MACCATALYST: NO
    frameworks:
      - Metal.framework
      - MetalKit.framework
    dependencies:
      - package: LiveKit
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      # M13: home-screen widget «Ближайший сеанс»
      - target: PlinkWidget
    info:
      path: Plink/Resources/Info.plist
      properties:
        CFBundleDisplayName: Плинк
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, en, zh]
        NSPhotoLibraryUsageDescription: Плинк использует галерею, чтобы вы могли выбрать и сменить аватар в профиле.
        NSPhotoLibraryAddUsageDescription: Плинк может сохранять изображения только по вашему действию.
        NSMicrophoneUsageDescription: Микрофон нужен для голосовых сообщений друзьям и голосового общения в комнате.
        NSCameraUsageDescription: Камера нужна для аватара и видеосообщений, когда вы их включите.
        UILaunchScreen:
          UIColorName: raveBackground
        UIRequiresFullScreen: false
        UIBackgroundModes:
          - audio
          - picture-in-picture
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Диплинки: plink://r/<code> и plink://u/<userId> (см. DeepLinkRouter).
        CFBundleURLTypes:
          - CFBundleURLName: com.syncwatch.plink
            CFBundleURLSchemes: [plink]
    entitlements:
      path: Plink/Resources/Plink.entitlements
      # ⚠️ Associated Domains (universal links) НЕ добавлять, пока команда —
      # личная (Personal Team): провижининг падает с "Personal development
      # teams do not support the Associated Domains capability".
      # После покупки Apple Developer Program вернуть properties:
      #   com.apple.developer.associated-domains:
      #     - applinks:plink.app
      #     - applinks:plink-backend-production-ef31.up.railway.app
      # Диплинки plink:// работают и без этого (CFBundleURLTypes выше).

  PlinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlinkTests
    dependencies:
      - target: Plink
      # M13: snapshot testing (tests are opt-in via SNAPSHOT_TESTS=1)
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syncwatch.plink.tests
        DEVELOPMENT_TEAM: "2QAMUC4Z4P"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PlinkTests

  # Аудит 30.07.2026: UI-смоук воронки (регистрация → главный экран →
  # комната) против живого локального бэкенда. Скриншоты пишутся в /tmp
  # (файл-флаг, как у MarketingShots). Запуск: -only-testing:PlinkUITests
  PlinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PlinkUITests
    dependencies:
      - target: Plink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syncwatch.plink.uitests
        DEVELOPMENT_TEAM: "2QAMUC4Z4P"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Plink

  # M13: home-screen widget — «Ближайший сеанс» (WidgetKit)
  PlinkWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PlinkWidget
        excludes:
          - "**/.DS_Store"
    entitlements:
      path: PlinkWidget/PlinkWidget.entitlements
    info:
      path: PlinkWidget/Info.plist
      properties:
        CFBundleDisplayName: Плинк
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syncwatch.plink.widget
        DEVELOPMENT_TEAM: "2QAMUC4Z4P"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
