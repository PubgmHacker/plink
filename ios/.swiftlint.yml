# SwiftLint configuration for the Plink iOS client.
#
# Division of labour with SwiftFormat (.swiftformat, same directory):
#
#   SwiftFormat owns whitespace and layout. It rewrites files.
#   SwiftLint owns semantics. It reports and does not rewrite.
#
# Every rule SwiftFormat can fix is disabled below rather than left on. Two tools
# with opinions about the same comma is the standard way a Swift setup ends up
# unrunnable: the linter fails on what the formatter just wrote.
#
# Severity policy, matching backend/eslint.config.js:
#
#   error   — an invariant. Currently at zero, and the gate is what keeps it there.
#   warning — measured debt. The count is written next to the rule. It may fall;
#             it must not rise.
#
# Counts below were measured across Plink/, PlinkTests/, PlinkUITests/ and
# PlinkWidget/ (221 files, ~64,900 lines): 0 errors, 4,697 warnings. Re-measure
# before editing a threshold, and note the count a rule REPORTS is not the same as
# a raw grep — line_length below is the clearest example, and russian_comment is
# the largest: the rule reports matched regions, a grep reports matching lines.
#
#   swiftlint lint --quiet --reporter csv | awk -F, 'NR>1{print $NF}' | sort | uniq -c | sort -rn

included:
  - Plink
  - PlinkTests
  - PlinkUITests
  - PlinkWidget

excluded:
  - android-client        # Kotlin
  - Plink.xcodeproj       # generated by xcodegen (ADR-0007)
  - .build
  - DerivedData
  - Pods

# ─────────────────────────────────────────────────────────────────────────────
# Rules SwiftFormat is authoritative for. Do not re-enable without removing the
# corresponding SwiftFormat rule, or the two tools will disagree on every save.
# ─────────────────────────────────────────────────────────────────────────────
disabled_rules:
  - comma                     # SwiftFormat: spaceAroundOperators / commas
  - colon                     # SwiftFormat: spaceAroundOperators
  - opening_brace             # SwiftFormat: braces
  - statement_position        # SwiftFormat: elseOnSameLine
  - trailing_comma            # SwiftFormat: trailingCommas
  - vertical_whitespace       # SwiftFormat: blankLinesAtEndOfScope / consecutiveBlankLines
  - trailing_newline          # SwiftFormat: linebreakAtEndOfFile
  - trailing_whitespace       # SwiftFormat: trailingSpace
  - leading_whitespace        # SwiftFormat: indent
  - return_arrow_whitespace   # SwiftFormat: spaceAroundOperators
  - switch_case_alignment     # SwiftFormat: indent (with indentCases)
  - attribute_name_spacing    # SwiftFormat: spaceAroundOperators / spaceAroundParens

  # Not a formatting rule, but SwiftUI view bodies are built out of trailing
  # closures and this fires on ordinary, readable code (6 sites, all correct).
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - empty_count
  - unowned_variable_capture
  - discouraged_optional_boolean
  - legacy_objc_type

analyzer_rules: []   # Require a compiled build; not run from `make lint`.

# ─────────────────────────────────────────────────────────────────────────────
# Invariants. These are at zero — keep them there.
# ─────────────────────────────────────────────────────────────────────────────

# A `!` cast or `try!` that fails takes the whole process down, and this app runs
# for the length of a film. The three legitimate sites — a generics-guarded
# `as! T` in APIClient and a compile-time-constant NSRegularExpression — carry an
# inline `swiftlint:disable:next` with the reason. Add a fourth only with one.
force_cast: error
force_try: error

# CONTRIBUTING.md forbids TODO/FIXME on main: either fix it, or file an issue and
# link it. Genuinely zero across all 221 files.
todo: error

# ─────────────────────────────────────────────────────────────────────────────
# Measured debt.
# ─────────────────────────────────────────────────────────────────────────────

# 36 sites in Plink/ across 22 files, plus 18 in tests. Most are
# `URL(string: <literal or config>)!`, which is safe by construction; a handful
# (`URL(string: service.browseURL)!`, `.first!` on a FileManager lookup) are not.
# This is a warning rather than an error because clearing it means deciding, per
# site, what the non-crashing behaviour should be — a change that needs the test
# suite, not a lint pass. CONTRIBUTING.md records the same number.
force_unwrapping:
  severity: warning

# 11 sites. An IUO is a force unwrap with a longer fuse.
implicitly_unwrapped_optional:
  severity: warning

# 53 sites. `Bool?` has three states and call sites reliably handle two.
discouraged_optional_boolean:
  severity: warning

# 17 sites (NSString/NSNumber/NSDictionary in bridging code).
legacy_objc_type:
  severity: warning

# 81 sites as this rule counts them. A raw grep finds 273 lines over 140, and the
# gap is the three ignores below — mostly long URLs and interpolated log strings,
# where the length is in the data rather than the code. No error threshold: a long
# line is a readability cost, not a defect, and SwiftFormat is set to `--maxwidth
# none`, so nothing wraps these automatically and this will not self-clear.
line_length:
  warning: 140
  ignores_urls: true
  ignores_comments: false
  ignores_interpolated_strings: true

# The default minimum of 3 characters is wrong for this codebase: the OKLCH
# conversion in V4/V4Theme.swift is written as `let a = c * cos(hr)` because that
# is what the formula calls its terms, and renaming them to `chromaComponentA`
# makes the maths unreadable. 593 of the default configuration's violations were
# single-letter locals of exactly this kind.
#
# `allowed_symbols: ["_"]` covers two deliberate uses of underscore:
#   * wire-format mirroring — `_count` (Prisma's key), `host_rising`, `plink_plus`
#     (server enum values, decoded by rawValue)
#   * keyword avoidance — `protocol_` (with `case protocol_ = "protocol"`), `body_`
#     in a View where `body` is already taken, `as_`
# Backticks would be the more idiomatic dodge, but renaming a Codable property
# changes key inference, so these stay.
identifier_name:
  min_length:
    warning: 1
  max_length:
    warning: 45
    error: 60
  allowed_symbols: ["_"]
  excluded:
    - id
    - ok
    - me
    - ui
    # LMS colour space terms in V4Theme.swift's OKLCH conversion. Capitalised
    # because that is how the transform matrix is written.
    - L
    - M
    - S

# `Logger` exposes its domains as lowercase enum namespaces so call sites read
# `Logger.ws.info(…)` rather than `Logger.WS.info(…)`. That is the point of the
# design, and `ws` is also under the 3-character minimum.
type_name:
  min_length:
    warning: 3
  max_length:
    warning: 45
    error: 60
  excluded:
    - app
    - ws
    - sync
    - webrtc
    - store
    - api

# Thresholds sit above today's worst case so the rule reports growth rather than
# 130 pre-existing violations nobody will read. Largest today:
#   WatchRoomModel.swift 2,497 · LocalizationManager.swift 2,235 · DMChatView.swift 2,100
# 48 files exceed the 400-line default. Lowering these is a refactor, tracked
# separately; raising them is not the fix.
file_length:
  warning: 1200
  error: 2600

type_body_length:
  warning: 1000
  error: 2400

function_body_length:
  warning: 120
  error: 300

cyclomatic_complexity:
  warning: 20
  error: 40

# Shape rules, warning-only on purpose. The worst cases today are a 5-member
# palette-sample tuple (CompactLivingBackdrop.swift:71) and a 15-parameter
# `blob(...)` (V4LivingBackground.swift:87). Both should become structs — and both
# are refactors that need the test suite, not something a commit gate can force.
# Giving these an error tier would either fail the build on working code or require
# a threshold set above the debt, which reports nothing. Neither is worth having.
large_tuple:
  warning: 3

function_parameter_count:
  warning: 8

# SwiftUI nests view builders inside computed properties inside a View; the default
# function_level of 3 fires on ordinary layout code.
nesting:
  type_level: 2
  function_level: 4

# The two rules below are the only place both tools touch the same code, and it is
# deliberate: SwiftFormat fixes, SwiftLint is what tells you it was worth fixing.
#
# implicit_optional_initialization  ← SwiftFormat redundantNilInit
# empty_count                      ← SwiftFormat isEmpty
#
# SwiftLint reports 74 `var x: T? = nil` sites; SwiftFormat's redundantNilInit
# reports 42. The gap is `let` bindings and property-wrapper declarations that
# SwiftFormat leaves alone, so the two numbers are expected to differ.
implicit_optional_initialization:
  severity: warning

# ─────────────────────────────────────────────────────────────────────────────
# Project rules. These encode decisions written down in docs/adr/; the prose is
# in the ADR, the mechanical check is here.
# ─────────────────────────────────────────────────────────────────────────────
custom_rules:
  # ADR-0004. `evil-vk.com.ru` contains "vk.com", so a substring check accepts it
  # and every participant in the room loads the attacker's page. All host
  # comparison goes through PlinkHost.matches, which compares registrable
  # domains. The `security` job in .github/workflows/ci.yml greps for the same
  # thing; this is the copy that fires in Xcode while you type.
  #
  # `match_kinds` keeps this out of comments. Without it the rule fired on
  # ServiceBrowserView.swift:812 — the comment that documents the old bug and
  # quotes `host.contains("rutube")` as the example of what not to do. Zero real
  # sites; the one hit was the rule matching its own cautionary tale.
  substring_host_match:
    name: "Substring host match"
    regex: 'host\??\.(lowercased\(\)\.)?contains\("'
    match_kinds:
      - identifier
      - string
    message: "Use PlinkHost.matches — a substring host check is an open redirect. See ADR-0004."
    severity: error
    excluded: ".*Tests?\\.swift"

  # CONTRIBUTING.md: history belongs in git log, decisions in docs/adr/, release
  # notes in CHANGELOG.md. A comment referencing a ticket, audit, phase or patch
  # number points at a document that no longer exists, so the reader learns
  # nothing and can verify nothing.
  #
  # 74 sites (`Ревью 26.07.2026:`, `Pack v3:`, `Phase 2.6:`, `FIX C3:`, `B6:`).
  # Rewrite the ones you touch to state the constraint instead of the ticket.
  ticket_reference_comment:
    name: "Ticket reference in a comment"
    regex: '(//|///|\*)[ \t]*.{0,40}\b((FIX|PATCH|Ревью|аудит|Audit)[ \t]+[A-ZА-Я0-9]|Phase[ \t]+[0-9]|Pack[ \t]+v[0-9]|[A-Z]{1,3}[0-9]{1,3}:)'
    message: "Say what the constraint is, not which ticket changed it. History is in git log; decisions are in docs/adr/."
    severity: warning

  # ADR-0001: English is the engineering language. User-facing copy is localized
  # through the string catalog and is not affected by this rule — it matches only
  # comments.
  #
  # 3,555 regions reported, across 152 files — by far the largest single number in
  # this file, and a dedicated pass rather than something to clear while passing
  # through. The same regex run as a line-based grep returns 3,773 (CONTRIBUTING.md
  # publishes that command): the rule counts matched regions and SwiftLint's line
  # attribution drifts on files this full of multibyte text, so trust the grep for
  # the debt figure and open the file rather than jumping to the reported line.
  # Localization/ is excluded: LocalizationManager.swift is the Russian
  # catalog itself, not a commented-in-Russian source file.
  #
  # Horizontal whitespace only, in this rule and in ticket_reference_comment
  # above: `\s` matches newlines in NSRegularExpression, which let a match open on
  # a bare `//` and run into text further down the block. A comment marker and its
  # text are on one line — keep it `[ \t]`.
  russian_comment:
    name: "Russian comment"
    regex: '(//|///|\*)[ \t]*.{0,60}[А-Яа-яЁё]{4,}'
    message: "Comments are English (ADR-0001). Translate this one while you are in the file."
    severity: warning
    excluded: ".*/Localization/.*"

  # ADR-0010. The token layer is what stopped the third UI generation from
  # drifting; hardcoding a size or a colour next to it starts the fourth.
  #
  # This is a warning, and a large one: 457 hardcoded font sizes and 260 colour
  # literals outside the token directories. The rule is here to stop the count
  # rising and to point new code at the tokens — it is not a gate, and
  # CONTRIBUTING.md says so rather than claiming the tokens are already universal.
  #
  # The token layer is four directories, not one: V4/ (colour, OKLCH),
  # Design/Cinematic/ (density), Design/Glass/ (surface), Design/Identity/.
  # The colour source of truth is V4/V4Theme.swift, which is NOT under Design/.
  hardcoded_font_size:
    name: "Hardcoded font size"
    regex: '\.system\(size:\s*[0-9]'
    message: "Use a typography token. See ADR-0010."
    severity: warning
    excluded: ".*/(Design|V4)/.*"

  hardcoded_color_literal:
    name: "Hardcoded colour"
    regex: 'Color\((red:|hex:)|UIColor\(red:'
    message: "Use a V4 colour token. See ADR-0010."
    severity: warning
    excluded: ".*/(Design|V4)/.*"

reporter: "xcode"
