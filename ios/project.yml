name: Plink
options:
  bundleIdPrefix: com.syncwatch
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

# The LiveKit dependency is commented out on purpose, and voice chat does not ship.
# RoomRTCController is a stub; the server answers 503 on POST /api/rtc/token because
# LIVEKIT_SFU is false in production; the voice UI is hidden on every surface.
#
# Re-enabling it is not just uncommenting these three lines. LiveKit's `Room` type
# collides with Plink's own `Room` model (import it as `LiveKit.Room`), and the SDK's
# participant/track API moved after the integration was written, so the publish and
# unpublish paths need porting. Expect a large WebRTC binary on first resolve.
#
# See docs/architecture/README.md § "Voice chat is not shipped".
packages:
  # LiveKit:
  #   url: https://github.com/livekit/client-sdk-swift
  #   from: 2.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.0.0
  # pixel-level UI snapshot tests (opt-in via SNAPSHOT_TESTS=1)
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "2QAMUC4Z4P"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    OTHER_LDFLAGS: ""

targets:
  Plink:
    type: application
    platform: iOS
    sources:
      - path: Plink
        excludes:
          - "**/.DS_Store"
      - path: Plink/Resources/Info.plist
        buildPhase: none
    resources:
      - path: Plink/Resources
        excludes:
          - "**/.DS_Store"
          # No .lproj here on purpose. The app has no NSLocalizedString call and no
          # Localizable.strings lookup anywhere; translations live in the in-code
          # L10n.table (Plink/Localization/LocalizationManager.swift), which is the
          # single source. Three dead .strings tables used to sit under Resources and
          # two of them collided in the copy-resources phase ("Multiple commands
          # produce .../en.lproj/Localizable.strings"). Do not reintroduce one to
          # "add a language" — add the language to L10n.table.
          # See docs/architecture/localization.md.
      - path: Plink/Resources/Emojis
        type: folder
      - path: Plink/Resources/LiveThemes
        type: folder
      - path: Plink/Resources/Avatars
        type: folder
      - path: Plink/Resources/Banners
        type: folder
      - path: Plink/Resources/CinemaBubbles
        type: folder
    # LiveKit dependency disabled — see comment at top of file.
    # dependencies:
    #   - package: LiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syncwatch.plink
        INFOPLIST_FILE: Plink/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Plink/Resources/Plink.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "2QAMUC4Z4P"
        CODE_SIGN_IDENTITY: "Apple Development"
        SUPPORTS_MACCATALYST: NO
    frameworks:
      - Metal.framework
      - MetalKit.framework
    dependencies:
      # - package: LiveKit  # see the note above packages: — deliberately off
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
      # Home-screen widget: the next scheduled session.
      - target: PlinkWidget
    info:
      path: Plink/Resources/Info.plist
      properties:
        CFBundleDisplayName: Плинк
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru, en, zh]
        NSPhotoLibraryUsageDescription: Плинк использует галерею, чтобы вы могли выбрать и сменить аватар в профиле.
        NSPhotoLibraryAddUsageDescription: Плинк может сохранять изображения только по вашему действию.
        NSMicrophoneUsageDescription: Микрофон нужен для голосовых сообщений друзьям и голосового общения в комнате.
        NSCameraUsageDescription: Камера нужна для аватара и видеосообщений, когда вы их включите.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIBackgroundModes:
          - audio
          - picture-in-picture
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Custom-scheme deep links: plink://r/<code> and plink://u/<userId>.
        # Routed by DeepLinkRouter. These work without Associated Domains.
        CFBundleURLTypes:
          - CFBundleURLName: com.syncwatch.plink
            CFBundleURLSchemes: [plink]
    entitlements:
      path: Plink/Resources/Plink.entitlements
      # Do NOT add Associated Domains (universal links) while the signing team is a
      # Personal Team. Provisioning fails outright with "Personal development teams do
      # not support the Associated Domains capability" — the build does not compile, so
      # this is a hard block rather than a degraded feature.
      #
      # Once the account is on the Apple Developer Program, restore:
      #   properties:
      #     com.apple.developer.associated-domains:
      #       - applinks:plink.app
      #       - applinks:plink-production.up.railway.app
      #
      # Until then, invite links open the website instead of the app; the plink://
      # scheme above still works. See docs/runbooks/ios-build-and-release.md.

  PlinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlinkTests
    dependencies:
      - target: Plink
      # Snapshot testing (tests are opt-in via SNAPSHOT_TESTS=1)
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syncwatch.plink.tests
        DEVELOPMENT_TEAM: "2QAMUC4Z4P"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PlinkTests

  # A smoke test of the whole funnel — sign-up, home screen, room — driven through the
  # UI against a LIVE local backend. It is not hermetic and is not in the default
  # scheme; run it from the Plink-UITests scheme, or with
  # `-only-testing:PlinkUITests`. Screenshots go to /tmp behind a file flag, the same
  # mechanism MarketingShots uses.
  PlinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PlinkUITests
    dependencies:
      - target: Plink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syncwatch.plink.uitests
        DEVELOPMENT_TEAM: "2QAMUC4Z4P"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Plink

  # WidgetKit home-screen widget: the next scheduled session.
  PlinkWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PlinkWidget
        excludes:
          - "**/.DS_Store"
    entitlements:
      path: PlinkWidget/PlinkWidget.entitlements
    info:
      path: PlinkWidget/Info.plist
      properties:
        CFBundleDisplayName: Плинк
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syncwatch.plink.widget
        DEVELOPMENT_TEAM: "2QAMUC4Z4P"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

# Schemes are declared here rather than left to Xcode's autocreation. Autocreation
# produced exactly two schemes (Plink, PlinkWidget), neither of which referenced a test
# bundle, and wrote them per-user rather than into xcshareddata — so `xcodebuild test`
# depended on whether someone had opened the project in Xcode first. Declaring them
# makes the test action part of the checked-in project description.
schemes:
  Plink:
    build:
      targets:
        Plink: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Plink
      targets:
        - PlinkTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Separate on purpose: PlinkUITests needs a backend on localhost and is therefore not
  # part of the default test action. Keeping it out means a red `Plink` scheme always
  # means a real defect, not a missing local server.
  Plink-UITests:
    build:
      targets:
        Plink: all
    test:
      config: Debug
      targets:
        - PlinkUITests
